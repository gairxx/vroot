# Example: install an upstream toolchain from a release tarball.
# Copy to ~/.config/vroot/recipes/mytool.conf, then run:  vroot -mytool
name = mytool
provides = mytool,mt
base = debian
packages = curl ca-certificates tar
setup = cd /opt && curl -fsSL https://example.com/mytool-1.0-linux-x86_64.tar.gz | tar -xz && ln -sf /opt/mytool/bin/mytool /usr/local/bin/mytool
env = MYTOOL_HOME=/opt/mytool
path = /opt/mytool/bin
verify = /usr/local/bin/mytool --version
description = Example: upstream release build
docs = https://example.com/docs
