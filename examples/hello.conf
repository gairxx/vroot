# Example: a tiny tool with no dependencies.
# Copy to ~/.config/vroot/recipes/hello.conf, then run:  vroot -hello
name = hello
provides = hello
base = alpine
packages = coreutils
setup = printf '#!/bin/sh\necho "hello from vroot"\n' > /usr/local/bin/hello && chmod +x /usr/local/bin/hello
env =
path = /usr/local/bin
verify = /usr/local/bin/hello
description = Example: prints a greeting
docs =
