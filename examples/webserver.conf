# Example: a language server built from packages, with aliases and env.
# Copy to ~/.config/vroot/recipes/webserver.conf, then run:  vroot -webserver
name = webserver
provides = webserver,httpd,serve
base = alpine
packages = python3 py3-pip
setup = python3 -m pip install --break-system-packages --no-cache-dir flask
env = FLASK_APP=/root/app.py,FLASK_DEBUG=0
path = /root/.local/bin
verify = python3 -c 'import flask'
description = Example: Python + Flask web service
docs = https://flask.palletsprojects.com/
