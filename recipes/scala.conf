name = scala
provides = scala,scala3
base = debian
packages = default-jdk unzip curl ca-certificates
setup = cd /opt && curl -fsSL https://github.com/scala/scala3/releases/download/3.4.2/scala3-3.4.2.zip -o s.zip && unzip -q s.zip && rm s.zip && ln -sf /opt/scala3-3.4.2/bin/scala /usr/local/bin/scala && ln -sf /opt/scala3-3.4.2/bin/scalac /usr/local/bin/scalac
env = JAVA_HOME=/usr/lib/jvm/default-java
path = /opt/scala3-3.4.2/bin
verify = /usr/local/bin/scala -version
description = Scala 3 (from scala-lang releases)
docs = https://docs.scala-lang.org/
