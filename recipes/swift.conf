name = swift
provides = swift
base = debian
packages = curl ca-certificates libncurses6 libpython3-dev libcurl4 libxml2 libedit2 binutils
setup = cd /opt && curl -fsSL https://download.swift.org/swift-5.10.1-release/ubuntu2204/swift-5.10.1-RELEASE/swift-5.10.1-RELEASE-ubuntu22.04.tar.gz | tar -xz && ln -sf /opt/swift-5.10.1-RELEASE-ubuntu22.04/usr/bin/swift /usr/local/bin/swift && ln -sf /opt/swift-5.10.1-RELEASE-ubuntu22.04/usr/bin/swiftc /usr/local/bin/swiftc
env =
path = /opt/swift-5.10.1-RELEASE-ubuntu22.04/usr/bin
verify = /usr/local/bin/swift --version
description = Swift toolchain (from swift.org)
docs = https://www.swift.org/documentation/
