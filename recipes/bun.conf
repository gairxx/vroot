name = bun
provides = bun
base = debian
packages = curl unzip ca-certificates
setup = BUN_INSTALL=/root/.bun curl -fsSL https://bun.sh/install | bash
env = BUN_INSTALL=/root/.bun
path = /root/.bun/bin
verify = /root/.bun/bin/bun --version
description = Bun runtime (installed from bun.sh)
docs = https://bun.sh/docs
