name = postgres
provides = postgres,postgresql,psql
base = alpine
packages = postgresql16 postgresql16-client
setup = mkdir -p /var/lib/postgresql/data && chown -R postgres:postgres /var/lib/postgresql 2>/dev/null || true
env = PGDATA=/var/lib/postgresql/data
path =
verify = psql --version
description = PostgreSQL server and client
docs = https://www.postgresql.org/docs/
