name = julia
provides = julia
base = debian
packages = curl ca-certificates
setup = cd /opt && curl -fsSL https://julialang-s3.julialang.org/bin/linux/x64/1.10/julia-1.10.5-linux-x86_64.tar.gz | tar -xz && ln -sf /opt/julia-1.10.5/bin/julia /usr/local/bin/julia
env = JULIA_DEPOT_PATH=/root/.julia
path = /root/.juliaup/bin
verify = /usr/local/bin/julia --version
description = Julia (installed from julialang.org)
docs = https://docs.julialang.org/
