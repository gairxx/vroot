name = kotlin
provides = kotlin,kotlinc
base = debian
packages = default-jdk-headless unzip curl ca-certificates
setup = cd /opt && curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip -o k.zip && unzip -q k.zip && rm k.zip && ln -sf /opt/kotlinc/bin/kotlin /usr/local/bin/kotlin && ln -sf /opt/kotlinc/bin/kotlinc /usr/local/bin/kotlinc
env = JAVA_HOME=/usr/lib/jvm/default-java
path = /opt/kotlinc/bin
verify = /usr/local/bin/kotlinc -version
description = Kotlin compiler (from JetBrains releases)
docs = https://kotlinlang.org/docs/home.html
