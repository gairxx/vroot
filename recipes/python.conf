name = python
provides = python,python3,py
base = alpine
packages = python3 py3-pip
setup = python3 -m pip install --break-system-packages --no-cache-dir pip setuptools wheel 2>/dev/null || true
env = PYTHONDONTWRITEBYTECODE=1
path = /root/.local/bin
verify = python3 -V
description = Python 3 with pip
docs = https://docs.python.org/3/
