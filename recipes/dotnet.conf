name = dotnet
provides = dotnet,.net,dotnet8,csharp,c#
base = alpine
packages = dotnet8-sdk dotnet8-runtime
setup = ln -sf /usr/lib/dotnet/dotnet /usr/local/bin/dotnet 2>/dev/null || true
env = DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 DOTNET_CLI_HOME=/root
path = /root/.dotnet/tools
verify = dotnet --version
description = .NET 8 SDK (C#, F#, VB)
docs = https://learn.microsoft.com/dotnet/
